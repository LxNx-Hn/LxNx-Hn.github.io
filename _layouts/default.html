<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — KIKI Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #87BFFF;
      --sky-soft: #BFE2FF;
      --ink: #13151a;
      --muted: #5b6472;
      --paper: #ffffff;
      --paper-2: #f4f8ff;
      --line: rgba(19,21,26,.10);
      --shadow: 0 10px 30px rgba(18,38,63,.10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 8% 12%, rgba(135,191,255,.38), transparent 56%),
        radial-gradient(740px 480px at 92% 18%, rgba(191,226,255,.45), transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px 64px;
    }
    nav {
      margin-bottom: 24px;
    }
    nav a {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.80);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      transition: .15s;
    }
    nav a:hover {
      border-color: rgba(135,191,255,.72);
      transform: translateY(-1px);
    }
    .post-header {
      margin-bottom: 28px;
    }
    .post-header h1 {
      font-family: Gaegu, Pretendard, sans-serif;
      font-size: 32px;
      margin: 0 0 8px;
    }
    .post-meta {
      font-size: 13px;
      color: var(--muted);
    }
    .content {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      line-height: 1.75;
    }
    .content h1, .content h2, .content h3 {
      font-family: Gaegu, Pretendard, sans-serif;
    }
    .content h2 { margin: 1.5em 0 .6em; font-size: 22px; }
    .content h3 { margin: 1.2em 0 .5em; font-size: 18px; }
    .content p { margin: 0 0 1em; }
    .content ul, .content ol { margin: 0 0 1em 1.4em; }
    .content li { margin-bottom: .4em; }
    .content a { color: #3a7bd5; }
    .content code {
      background: rgba(135,191,255,.15);
      border: 1px solid rgba(135,191,255,.35);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: .9em;
    }
    .content pre {
      background: #f4f8ff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0 0 1em;
    }
    .content pre code {
      background: none;
      border: none;
      padding: 0;
    }
    .content blockquote {
      border-left: 3px solid var(--sky);
      margin: 0 0 1em;
      padding: .5em 1em;
      color: var(--muted);
    }
    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/">← Home</a></nav>
    <div class="post-header">
      <h1>{{ page.title }}</h1>
      {% if page.date %}<div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</div>{% endif %}
    </div>
    <div class="content">
      {{ content }}
    </div>
    <footer>© {{ site.time | date: "%Y" }} KIKI Archive</footer>
  </div>
</body>
</html>
