<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI — KIKI Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --sky:#87BFFF;
      --ink:#13151a;
      --muted:#5b6472;
      --line:rgba(19,21,26,.10);
      --bg:#f5f3ee;
      --paper:#ffffff;
      --sidebar-bg:#fdfcf9;
      --shadow:0 4px 24px rgba(18,38,63,.09);
      --radius:14px;
      --sidebar-w:260px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      color:var(--ink);
      background:var(--bg);
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ── top nav ── */
    .topbar{
      display:flex;align-items:center;gap:10px;
      padding:10px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(253,252,249,.92);
      backdrop-filter:blur(12px);
      flex:0 0 auto;
      min-height:48px;
    }
    /* Toggle button — leftmost in topbar, visually distinct */
    .sidebar-toggle{
      display:inline-flex;align-items:center;gap:5px;
      padding:6px 11px;
      border-radius:8px;
      border:1px solid rgba(19,21,26,.15);
      background:var(--paper);
      box-shadow:0 1px 4px rgba(0,0,0,.07);
      cursor:pointer;
      font-size:12px;
      font-family:inherit;
      color:var(--ink);
      white-space:nowrap;
      transition:background .12s, border-color .12s, box-shadow .12s;
      flex:0 0 auto;
    }
    .sidebar-toggle:hover{
      background:#f0edea;
      border-color:rgba(135,191,255,.65);
      box-shadow:0 2px 8px rgba(135,191,255,.20);
    }
    .toggle-icon{font-size:11px;transition:transform .22s ease}
    .sidebar-collapsed-state .toggle-icon{transform:scaleX(-1)}

    .crumb-link{
      display:inline-flex;align-items:center;gap:4px;
      padding:5px 11px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.80);
      text-decoration:none;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      transition:border-color .12s, color .12s;
    }
    .crumb-link:hover{border-color:rgba(135,191,255,.65);color:var(--ink)}
    .crumb-sep{color:var(--muted);font-size:12px;opacity:.6}
    .page-title{
      font-size:13px;font-weight:600;
      color:var(--ink);
      margin-left:2px;
      font-family:Gaegu,Pretendard,sans-serif;
    }

    /* ── two-column layout ── */
    .body{
      display:grid;
      grid-template-columns:var(--sidebar-w) 1fr;
      flex:1;
      min-height:0;
      transition:grid-template-columns .24s cubic-bezier(.4,0,.2,1);
    }
    .body.sidebar-collapsed{
      grid-template-columns:0px 1fr;
    }

    /* ── left list panel ── */
    .sidebar{
      border-right:1px solid var(--line);
      background:var(--sidebar-bg);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    .body.sidebar-collapsed .sidebar{
      border-right:none;
    }

    .sidebar-head{
      padding:12px 12px 8px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }
    .sidebar-label{
      font-size:10px;font-weight:700;
      letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin-bottom:8px;
    }
    .search{
      width:100%;
      padding:7px 10px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.90);
      outline:none;
      font-size:13px;
      font-family:inherit;
      transition:border-color .12s;
    }
    .search:focus{border-color:rgba(135,191,255,.65)}
    .list{
      flex:1;
      overflow-y:auto;
      padding:8px;
    }
    .list::-webkit-scrollbar{width:4px}
    .list::-webkit-scrollbar-track{background:transparent}
    .list::-webkit-scrollbar-thumb{background:rgba(19,21,26,.12);border-radius:4px}
    .item{
      display:block;
      width:100%;
      text-align:left;
      border:1px solid transparent;
      background:transparent;
      padding:10px 11px;
      border-radius:10px;
      cursor:pointer;
      transition:.12s;
      margin-bottom:3px;
      font-family:inherit;
    }
    .item:hover{background:rgba(135,191,255,.10);border-color:rgba(135,191,255,.20)}
    .item.active{
      border-color:rgba(135,191,255,.55);
      background:rgba(135,191,255,.13);
    }
    .it-title{font-weight:600;font-size:13px;margin-bottom:3px;color:var(--ink)}
    .it-meta{font-size:11px;color:var(--muted)}

    /* ── right viewer panel ── */
    .viewer{
      min-width:0;
      overflow:auto;
      background:var(--bg);
      position:relative;
    }

    /* When sidebar is open: viewer fills remaining space */
    /* When sidebar is collapsed: inner content is centered with max-width */
    .viewer-inner{
      display:flex;
      flex-direction:column;
      min-height:calc(100vh - 48px);
      width:100%;
      transition:max-width .24s cubic-bezier(.4,0,.2,1), margin .24s cubic-bezier(.4,0,.2,1), padding .24s cubic-bezier(.4,0,.2,1);
    }
    .body.sidebar-collapsed .viewer-inner{
      max-width:900px;
      margin:0 auto;
      padding:0 20px;
    }

    .viewer-placeholder{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:13px;
      min-height:200px;
    }
    .viewer-inner iframe{
      flex:1;
      width:100%;
      border:none;
      display:block;
      min-height:calc(100vh - 48px);
    }

    @media(max-width:720px){
      body{height:auto;overflow:auto}
      .body{
        grid-template-columns:1fr;
        grid-template-rows:auto 1fr;
      }
      .body.sidebar-collapsed{
        grid-template-columns:1fr;
        grid-template-rows:0px 1fr;
      }
      .sidebar{
        border-right:none;
        border-bottom:1px solid var(--line);
        max-height:240px;
        overflow:hidden;
      }
      .body.sidebar-collapsed .sidebar{
        max-height:0;
        border-bottom:none;
      }
      .viewer-inner{overflow:visible}
      .viewer-inner iframe{min-height:65vh}
      .body.sidebar-collapsed .viewer-inner{
        max-width:100%;
        padding:0 12px;
        margin:0;
      }
    }
  </style>
</head>
<body>

  <nav class="topbar" id="topbar">
    <button class="sidebar-toggle" id="sidebarToggle" title="목록 패널 열기/닫기">
      <span class="toggle-icon" id="toggleIcon">☰</span>
      <span id="toggleLabel">목록</span>
    </button>
    <a class="crumb-link" href="/">← Home</a>
    <span class="crumb-sep">/</span>
    <span class="page-title">AI</span>
  </nav>

  <div class="body" id="bodyEl">
    <!-- LEFT: post list -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-label">AI 포스트</div>
        <input id="q" class="search" placeholder="검색…" autocomplete="off" />
      </div>
      <div id="list" class="list"></div>
    </aside>

    <!-- RIGHT: iframe viewer -->
    <section class="viewer">
      <div class="viewer-inner" id="viewerInner">
        <div class="viewer-placeholder" id="placeholder">← 왼쪽 목록에서 글을 선택하세요</div>
      </div>
    </section>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // AI 포스트 목록
    // 새 글 추가 방법: /ai/ 폴더에 HTML 파일 추가 후, 아래 배열에 항목 하나 추가
    // 예: { slug:"my-post", title:"제목", date:"2026-01-01", tags:["AI"], href:"my-post.html" }
    // ──────────────────────────────────────────────────────────────────────
    const POSTS = [
      {
        slug: "cnn",
        title: "CNN Shape 변환 해설 — CIFAR-10 & 한글 감성분석",
        date: "2026-04-04",
        tags: ["CNN", "CIFAR-10", "Keras", "PyTorch"],
        href: "cnn.html"
      },
      {
        slug: "post1",
        title: "Shape 흐름 체크포인트",
        date: "2026-04-04",
        tags: ["CNN", "Keras", "PyTorch"],
        href: "post1.html"
      },
      {
        slug: "post2",
        title: "학습 루프 정리",
        date: "2026-04-04",
        tags: ["CNN", "Training", "Keras", "PyTorch"],
        href: "post2.html"
      }
    ];
    // ──────────────────────────────────────────────────────────────────────

    const qEl = document.getElementById("q");
    const listEl = document.getElementById("list");
    const viewerInnerEl = document.getElementById("viewerInner");
    const placeholderEl = document.getElementById("placeholder");

    let currentSlug = null;
    let iframeEl = null;

    function renderList() {
      const q = (qEl.value || "").toLowerCase();
      listEl.innerHTML = "";
      POSTS
        .filter(p => (p.title + " " + p.tags.join(" ")).toLowerCase().includes(q))
        .forEach(p => {
          const btn = document.createElement("button");
          btn.className = "item" + (p.slug === currentSlug ? " active" : "");
          btn.dataset.slug = p.slug;
          btn.innerHTML =
            '<div class="it-title">' + escHtml(p.title) + '</div>' +
            '<div class="it-meta">' + escHtml(p.date) + ' &middot; ' + escHtml(p.tags.join(" · ")) + '</div>';
          btn.addEventListener("click", () => openPost(p.slug));
          listEl.appendChild(btn);
        });
    }

    function openPost(slug) {
      const p = POSTS.find(x => x.slug === slug);
      if (!p) return;
      currentSlug = slug;

      placeholderEl.style.display = "none";

      if (!iframeEl) {
        iframeEl = document.createElement("iframe");
        iframeEl.style.flex = "1";
        iframeEl.style.width = "100%";
        iframeEl.style.border = "none";
        viewerInnerEl.appendChild(iframeEl);
      }
      iframeEl.src = p.href;

      renderList();
      history.replaceState(null, "", "#" + encodeURIComponent(slug));
    }

    function escHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    qEl.addEventListener("input", renderList);

    // ── sidebar toggle ──────────────────────────────────────────────────────
    const STORAGE_KEY = "ai_sidebar_hidden";
    const bodyEl = document.getElementById("bodyEl");
    const topbarEl = document.getElementById("topbar");
    const toggleBtn = document.getElementById("sidebarToggle");
    const toggleIcon = document.getElementById("toggleIcon");
    const toggleLabel = document.getElementById("toggleLabel");

    function applySidebarState(hidden) {
      if (hidden) {
        bodyEl.classList.add("sidebar-collapsed");
        topbarEl.classList.add("sidebar-collapsed-state");
        toggleIcon.style.opacity = ".45";
        toggleLabel.textContent = "목록";
        toggleBtn.title = "목록 패널 열기";
      } else {
        bodyEl.classList.remove("sidebar-collapsed");
        topbarEl.classList.remove("sidebar-collapsed-state");
        toggleIcon.style.opacity = "1";
        toggleLabel.textContent = "목록";
        toggleBtn.title = "목록 패널 닫기";
      }
    }

    applySidebarState(localStorage.getItem(STORAGE_KEY) === "1");

    function toggleSidebar() {
      const nowHidden = !bodyEl.classList.contains("sidebar-collapsed");
      localStorage.setItem(STORAGE_KEY, nowHidden ? "1" : "0");
      applySidebarState(nowHidden);
    }

    toggleBtn.addEventListener("click", toggleSidebar);
    // ────────────────────────────────────────────────────────────────────────

    // deep-link via hash
    const hash = decodeURIComponent((location.hash || "").slice(1));
    renderList();
    if (hash && POSTS.find(p => p.slug === hash)) {
      openPost(hash);
    } else if (POSTS.length > 0) {
      openPost(POSTS[0].slug);
    }
  </script>
</body>
</html>
