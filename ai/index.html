<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI — KIKI Archive</title>
  <style>
    :root{
      --sky:#87BFFF;
      --ink:#13151a;
      --muted:#5b6472;
      --line:rgba(19,21,26,.10);
      --paper:rgba(255,255,255,.82);
      --shadow:0 10px 30px rgba(18,38,63,.10);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      color:var(--ink);
      background:
        radial-gradient(900px 520px at 8% 12%, rgba(135,191,255,.30), transparent 56%),
        radial-gradient(740px 480px at 92% 18%, rgba(191,226,255,.36), transparent 60%),
        #f4f8ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ── top nav ── */
    .topbar{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(10px);
      flex:0 0 auto;
    }
    .crumb-link{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.85);
      text-decoration:none;
      color:var(--ink);
      font-size:12px;
      white-space:nowrap;
    }
    .crumb-link:hover{border-color:rgba(135,191,255,.65)}
    .crumb-sep{color:var(--muted);font-size:12px}
    .page-title{
      font-size:13px;font-weight:700;
      color:var(--muted);
    }

    /* ── two-column layout ── */
    .body{
      display:grid;
      grid-template-columns:300px 1fr;
      flex:1;
      min-height:0;
      transition:grid-template-columns .22s ease;
    }
    .body.sidebar-collapsed{
      grid-template-columns:0px 1fr;
    }

    /* ── left list panel ── */
    .sidebar{
      border-right:1px solid var(--line);
      background:var(--paper);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      transition:width .22s ease;
    }
    .body.sidebar-collapsed .sidebar{
      border-right:none;
    }

    /* ── sidebar toggle button ── */
    .sidebar-toggle{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.85);
      cursor:pointer;
      font-size:12px;
      color:var(--ink);
      white-space:nowrap;
      transition:.12s;
      margin-left:auto;
    }
    .sidebar-toggle:hover{border-color:rgba(135,191,255,.65)}
    .sidebar-head{
      padding:12px 12px 8px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }
    .search{
      width:100%;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.90);
      outline:none;
      font-size:13px;
    }
    .list{
      flex:1;
      overflow-y:auto;
      padding:8px;
    }
    .item{
      display:block;
      width:100%;
      text-align:left;
      border:1px solid transparent;
      background:transparent;
      padding:10px 10px;
      border-radius:12px;
      cursor:pointer;
      transition:.12s;
      margin-bottom:4px;
    }
    .item:hover{background:rgba(135,191,255,.10)}
    .item.active{
      border-color:rgba(135,191,255,.65);
      background:rgba(135,191,255,.12);
    }
    .it-title{font-weight:700;font-size:13px;margin-bottom:3px}
    .it-meta{font-size:11px;color:var(--muted)}

    /* ── right iframe panel ── */
    .viewer{
      flex:1;
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .viewer-placeholder{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:13px;
    }
    .viewer iframe{
      flex:1;
      width:100%;
      border:none;
      display:block;
    }

    @media(max-width:700px){
      body{height:auto}
      .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .body.sidebar-collapsed{grid-template-columns:1fr;grid-template-rows:0px 1fr}
      .sidebar{border-right:none;border-bottom:1px solid var(--line);max-height:260px}
      .body.sidebar-collapsed .sidebar{max-height:0;border-bottom:none}
      .viewer iframe{height:60vh}
    }
  </style>
</head>
<body>

  <nav class="topbar">
    <a class="crumb-link" href="/">← Home</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-sep" style="font-weight:700;color:var(--ink)">AI</span>
    <div class="page-title">KIKI Archive · AI</div>
    <button class="sidebar-toggle" id="sidebarToggle" title="사이드바 숨기기/보이기">
      <span id="toggleIcon">◀</span>
      <span id="toggleLabel">목록 숨기기</span>
    </button>
  </nav>

  <div class="body">
    <!-- LEFT: post list -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <input id="q" class="search" placeholder="Search posts…" />
      </div>
      <div id="list" class="list"></div>
    </aside>

    <!-- RIGHT: iframe viewer -->
    <section class="viewer" id="viewer">
      <div class="viewer-placeholder" id="placeholder">← 왼쪽 목록에서 글을 선택하세요</div>
    </section>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // AI 포스트 목록
    // 새 글 추가 방법: /ai/ 폴더에 HTML 파일 추가 후, 아래 배열에 항목 하나 추가
    // 예: { slug:"my-post", title:"제목", date:"2026-01-01", tags:["AI"], href:"my-post.html" }
    // ──────────────────────────────────────────────────────────────────────
    const POSTS = [
      {
        slug: "cnn",
        title: "CNN Shape 변환 해설 — CIFAR-10 & 한글 감성분석",
        date: "2026-04-04",
        tags: ["CNN", "CIFAR-10", "Keras", "PyTorch"],
        href: "cnn.html"
      },
      {
        slug: "post1",
        title: "Shape 흐름 체크포인트",
        date: "2026-04-04",
        tags: ["CNN", "Keras", "PyTorch"],
        href: "post1.html"
      },
      {
        slug: "post2",
        title: "학습 루프 정리",
        date: "2026-04-04",
        tags: ["CNN", "Training", "Keras", "PyTorch"],
        href: "post2.html"
      }
    ];
    // ──────────────────────────────────────────────────────────────────────

    const qEl = document.getElementById("q");
    const listEl = document.getElementById("list");
    const viewerEl = document.getElementById("viewer");
    const placeholderEl = document.getElementById("placeholder");

    let currentSlug = null;
    let iframeEl = null;

    function renderList() {
      const q = (qEl.value || "").toLowerCase();
      listEl.innerHTML = "";
      POSTS
        .filter(p => (p.title + " " + p.tags.join(" ")).toLowerCase().includes(q))
        .forEach(p => {
          const btn = document.createElement("button");
          btn.className = "item" + (p.slug === currentSlug ? " active" : "");
          btn.dataset.slug = p.slug;
          btn.innerHTML =
            '<div class="it-title">' + escHtml(p.title) + '</div>' +
            '<div class="it-meta">' + escHtml(p.date) + ' &middot; ' + escHtml(p.tags.join(" · ")) + '</div>';
          btn.addEventListener("click", () => openPost(p.slug));
          listEl.appendChild(btn);
        });
    }

    function openPost(slug) {
      const p = POSTS.find(x => x.slug === slug);
      if (!p) return;
      currentSlug = slug;

      placeholderEl.style.display = "none";

      if (!iframeEl) {
        iframeEl = document.createElement("iframe");
        iframeEl.style.flex = "1";
        iframeEl.style.width = "100%";
        iframeEl.style.border = "none";
        viewerEl.appendChild(iframeEl);
      }
      iframeEl.src = p.href;

      renderList();
      history.replaceState(null, "", "#" + encodeURIComponent(slug));
    }

    function escHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    qEl.addEventListener("input", renderList);

    // ── sidebar toggle ──────────────────────────────────────────────────────
    const STORAGE_KEY = "ai_sidebar_hidden";
    const bodyEl = document.querySelector(".body");
    const toggleBtn = document.getElementById("sidebarToggle");
    const toggleIcon = document.getElementById("toggleIcon");
    const toggleLabel = document.getElementById("toggleLabel");

    function applySidebarState(hidden) {
      if (hidden) {
        bodyEl.classList.add("sidebar-collapsed");
        toggleIcon.textContent = "▶";
        toggleLabel.textContent = "목록 보이기";
      } else {
        bodyEl.classList.remove("sidebar-collapsed");
        toggleIcon.textContent = "◀";
        toggleLabel.textContent = "목록 숨기기";
      }
    }

    // restore from localStorage
    applySidebarState(localStorage.getItem(STORAGE_KEY) === "1");

    toggleBtn.addEventListener("click", () => {
      const nowHidden = !bodyEl.classList.contains("sidebar-collapsed");
      localStorage.setItem(STORAGE_KEY, nowHidden ? "1" : "0");
      applySidebarState(nowHidden);
    });
    // ────────────────────────────────────────────────────────────────────────

    // deep-link via hash
    const hash = decodeURIComponent((location.hash || "").slice(1));
    renderList();
    if (hash && POSTS.find(p => p.slug === hash)) {
      openPost(hash);
    } else if (POSTS.length > 0) {
      openPost(POSTS[0].slug);
    }
  </script>
</body>
</html>
