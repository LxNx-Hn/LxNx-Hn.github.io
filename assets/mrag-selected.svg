<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">M_RAG cross-lingual RAG flow</title>
  <desc id="desc">Korean query to English papers, HyDE CAD SCD experiment, bilingual evaluation</desc>

  <rect width="720" height="450" rx="24" fill="#f0f2ee"/>
  <rect x="42" y="40" width="74" height="6" rx="3" fill="#e2303d"/>
  <text x="42" y="82" fill="#b51e2a" font-family="Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">CROSS-LINGUAL RAG</text>

  <text x="42" y="133" fill="#142033" font-family="Arial,sans-serif" font-size="31" font-weight="800">Korean → English → Korean</text>

  <g transform="translate(42 190)">
    <rect width="132" height="126" rx="18" fill="#ffffff" stroke="#d7ddd5" stroke-width="2"/>
    <circle cx="28" cy="28" r="12" fill="#16243b"/>
    <text x="28" y="32" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10" font-weight="800">KR</text>
    <text x="18" y="78" fill="#142033" font-family="Arial,sans-serif" font-size="19" font-weight="800">KR Query</text>
  </g>

  <text x="187" y="264" fill="#e2303d" font-family="Arial,sans-serif" font-size="26" font-weight="800">→</text>

  <g transform="translate(216 190)">
    <rect width="132" height="126" rx="18" fill="#ffffff" stroke="#d7ddd5" stroke-width="2"/>
    <circle cx="28" cy="28" r="12" fill="#16243b"/>
    <text x="28" y="32" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10" font-weight="800">EN</text>
    <text x="18" y="78" fill="#142033" font-family="Arial,sans-serif" font-size="19" font-weight="800">EN Papers</text>
  </g>

  <text x="361" y="264" fill="#e2303d" font-family="Arial,sans-serif" font-size="26" font-weight="800">→</text>

  <g transform="translate(390 190)">
    <rect width="164" height="126" rx="18" fill="#16243b"/>
    <text x="18" y="39" fill="#f48a91" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.1">8 CONFIGS</text>
    <text x="18" y="78" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="800">HyDE · CAD · SCD</text>
  </g>

  <text x="568" y="264" fill="#e2303d" font-family="Arial,sans-serif" font-size="26" font-weight="800">→</text>

  <g transform="translate(596 190)">
    <rect width="82" height="126" rx="18" fill="#ffffff" stroke="#d7ddd5" stroke-width="2"/>
    <text x="14" y="52" fill="#b51e2a" font-family="Arial,sans-serif" font-size="11" font-weight="800">Bilingual</text>
    <text x="14" y="76" fill="#142033" font-family="Arial,sans-serif" font-size="16" font-weight="800">Eval</text>
  </g>

  <line x1="42" y1="364" x2="678" y2="364" stroke="#d7ddd5"/>
  <text x="42" y="402" fill="#596273" font-family="Arial,sans-serif" font-size="14">검색·생성 방법보다 평가 조건을 함께 비교한 연구</text>
</svg>