<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIKI Archive</title>
  <meta name="description" content="KIKI의 AI 공부 기록 + 프로젝트 정리 (KR/EN)" />

  <!-- Fonts: 제목(아기자기) + 본문(깔끔) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --sky:#87BFFF;
      --sky-soft:#BFE2FF;
      --ink:#13151a;
      --muted:#5b6472;
      --paper:#ffffff;
      --paper-2:#f5f3ee;
      --line:rgba(19,21,26,.10);
      --shadow:0 10px 30px rgba(18,38,63,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(900px 520px at 8% 12%, rgba(135,191,255,.22), transparent 56%),
        radial-gradient(740px 480px at 92% 18%, rgba(191,226,255,.28), transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap{max-width:960px;margin:0 auto;padding:20px 18px 40px}
    .top{
      display:flex;align-items:center;
      margin-bottom:18px;gap:10px;flex-wrap:wrap;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      padding:8px 14px;border:1px solid var(--line);
      border-radius:12px;background:rgba(255,255,255,.80);
      backdrop-filter: blur(10px);
      flex:1;min-width:0;
    }
    .dot{width:9px;height:9px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 5px rgba(135,191,255,.22);flex:0 0 auto}
    .brand b{font-family: Gaegu, Pretendard, sans-serif; font-size:20px; letter-spacing:.2px}
    .brand span{color:var(--muted); font-size:12px}
    .meta{color:var(--muted);font-size:12px;display:none}

    .layout{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:16px;
      align-items:start;
      transition:grid-template-columns .24s cubic-bezier(.4,0,.2,1), gap .24s cubic-bezier(.4,0,.2,1);
    }
    .layout.sidebar-collapsed{
      grid-template-columns: 0px 1fr;
      gap:0;
    }
    .layout.sidebar-collapsed .profile{
      display:none;
    }
    /* When profile is hidden, center the main content */
    .layout.sidebar-collapsed .main{
      max-width:700px;
      margin:0 auto;
      width:100%;
    }

    /* ── sidebar toggle (root) ── */
    .sidebar-toggle{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 11px;
      border-radius:8px;
      border:1px solid rgba(19,21,26,.15);
      background:rgba(255,255,255,.90);
      box-shadow:0 1px 4px rgba(0,0,0,.07);
      cursor:pointer;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      transition:background .12s, border-color .12s;
      font-family:inherit;
    }
    .sidebar-toggle:hover{background:#f0edea;border-color:rgba(135,191,255,.65);color:var(--ink)}

    .card{
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    /* LEFT: Profile */
    .profile{padding:18px}
    .avatarRow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .avatar{
      width:62px;height:62px;border-radius:18px;
      border:1px solid rgba(135,191,255,.55);
      box-shadow:0 12px 22px rgba(135,191,255,.18);
      overflow:hidden;background:#fff;
      flex:0 0 auto;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .name{
      margin:0;
      font-family: Gaegu, Pretendard, sans-serif;
      font-weight:700;
      font-size:34px;
      line-height:1;
    }
    .sub{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}

    .bio{
      margin:12px 0 14px;
      padding:12px 12px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(135,191,255,.18), rgba(135,191,255,.06));
      border:1px solid rgba(135,191,255,.38);
      color:#24374f;
      font-size:13px;
      line-height:1.65;
    }
    .bio .title{
      font-family: Gaegu, Pretendard, sans-serif;
      font-size:18px;
      font-weight:700;
      margin-bottom:6px;
    }

    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
    .chip{
      font-size:12px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(19,21,26,.10);
      background:rgba(255,255,255,.72);
      color:#2a3950;
    }

    .links{display:grid;gap:10px}
    .linkBtn{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 12px;border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.80);
      text-decoration:none;color:var(--ink);
      transition:.15s;
    }
    .linkBtn:hover{transform:translateY(-1px);border-color:rgba(135,191,255,.72)}
    .linkBtn span{color:var(--muted);font-size:12px}

    /* RIGHT: Sections */
    .main{padding:18px}
    .hero{
      padding:14px;
      border-radius:16px;
      border:1px dashed rgba(135,191,255,.70);
      background: linear-gradient(180deg, rgba(135,191,255,.16), rgba(255,255,255,.55));
      margin-bottom:14px;
    }
    .hero h2{
      margin:0;
      font-family: Gaegu, Pretendard, sans-serif;
      font-size:28px;
    }
    .hero p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}

    .sections{display:flex;flex-direction:column;gap:10px}
    .section-btn{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.82);
      text-decoration:none;color:inherit;
      transition:.15s;
      position:relative;overflow:hidden;
    }
    .section-btn:before{
      content:"";
      position:absolute; inset:-46px -46px auto auto;
      width:160px;height:160px;
      background: radial-gradient(circle at 30% 30%, rgba(135,191,255,.55), transparent 60%);
      transform: rotate(18deg);
    }
    .section-btn:hover{transform:translateY(-2px);border-color:rgba(135,191,255,.72)}
    .section-btn-title{
      position:relative;
      font-family: Gaegu, Pretendard, sans-serif;
      font-size:22px;
      font-weight:700;
      margin:0 0 4px;
    }
    .section-btn-desc{position:relative;color:var(--muted);font-size:13px}
    .section-btn-arrow{position:relative;font-size:20px;color:rgba(135,191,255,.9)}

    .footer{
      margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px;
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }

    @media (max-width: 920px){
      .layout{grid-template-columns:1fr}
      .layout.sidebar-collapsed{grid-template-columns:1fr}
      .layout.sidebar-collapsed .main{max-width:100%;margin:0}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <b>KIKI</b>
          <div><span>AI · Paper review · Projects (KR/EN)</span></div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" title="프로필 패널 열기/닫기">
        <span id="toggleIcon">☰</span>
        <span id="toggleLabel">프로필</span>
      </button>
    </div>

    <div class="layout">
      <!-- LEFT -->
      <aside class="card profile">
        <div class="avatarRow">
          <div class="avatar">
            <img alt="GitHub Avatar" src="https://github.com/LxNx-Hn.png" />
          </div>
          <div>
            <h1 class="name">KIKI</h1>
            <div class="sub">AI공부 기록 + 프로젝트정리</div>
          </div>
        </div>

        <div class="bio">
          <div class="title">About / 소개</div>
          프로젝트별로 글을 모아두는 블로그 스타일로 운영할 예정.<br/>
          기록: 실험 로그 · 개념 정리 · 구현 코드 · 삽질 포인트.
        </div>

        <div class="links">
          <a class="linkBtn" href="https://github.com/LxNx-Hn" target="_blank" rel="noreferrer">
            <div><b>GitHub</b></div><span>↗</span>
          </a>
          <a class="linkBtn" href="/notes/">
            <div><b>Notes</b></div><span>📝</span>
          </a>
        </div>
      </aside>

      <!-- RIGHT -->
      <main class="card main">
        <section class="hero">
          <h2>KIKI Archive</h2>
          <p>AI공부 기록 + 프로젝트정리</p>
        </section>

        <div class="sections">
          <!-- AI 섹션 -->
          <a class="section-btn" href="/ai/">
            <div>
              <div class="section-btn-title">AI</div>
              <div class="section-btn-desc">CNN · 딥러닝 · Keras · PyTorch 학습 기록</div>
            </div>
            <div class="section-btn-arrow">→</div>
          </a>

          <!--
          Review 섹션 (콘텐츠 추가 후 주석 해제)
          <a class="section-btn" href="/review/">
            <div>
              <div class="section-btn-title">Review</div>
              <div class="section-btn-desc">논문 리뷰</div>
            </div>
            <div class="section-btn-arrow">→</div>
          </a>
          -->

          <!--
          Project 섹션 (콘텐츠 추가 후 주석 해제)
          <a class="section-btn" href="/project/">
            <div>
              <div class="section-btn-title">Project</div>
              <div class="section-btn-desc">프로젝트 정리</div>
            </div>
            <div class="section-btn-arrow">→</div>
          </a>
          -->
        </div>

        <div class="footer">
          <div>© <span id="y"></span> KIKI</div>
          <div>Repo: LxNx-Hn/LxNx-Hn.github.io</div>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    // ── sidebar toggle ──────────────────────────────────────────────────────
    const STORAGE_KEY = "root_sidebar_hidden";
    const layoutEl = document.querySelector(".layout");
    const toggleBtn = document.getElementById("sidebarToggle");
    const toggleIcon = document.getElementById("toggleIcon");
    const toggleLabel = document.getElementById("toggleLabel");

    function applySidebarState(hidden) {
      if (hidden) {
        layoutEl.classList.add("sidebar-collapsed");
        toggleIcon.style.opacity = ".45";
      } else {
        layoutEl.classList.remove("sidebar-collapsed");
        toggleIcon.style.opacity = "1";
      }
    }

    applySidebarState(localStorage.getItem(STORAGE_KEY) === "1");

    toggleBtn.addEventListener("click", () => {
      const nowHidden = !layoutEl.classList.contains("sidebar-collapsed");
      localStorage.setItem(STORAGE_KEY, nowHidden ? "1" : "0");
      applySidebarState(nowHidden);
    });
    // ────────────────────────────────────────────────────────────────────────
  </script>
</body>
</html>
